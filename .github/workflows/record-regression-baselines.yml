name: Record visual regression baselines
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to regenerate baselines on and push the result to
        required: true
        default: main

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1/find_unclaimed_court_money_test"

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: find_unclaimed_court_money_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install packages
        run: yarn install --frozen-lockfile

      - name: Precompile assets
        run: bin/rails assets:precompile

      - name: Setup test database
        run: bin/rails db:prepare

      - name: Record regression screenshots
        # capybara-screenshot-diff always restores the committed baseline PNG
        # via `git show HEAD:<path>` before comparing, so deleting it from the
        # working tree first (as this step used to) has no effect - it just
        # gets recreated from git. RECORD_SCREENSHOTS/fail_if_new only
        # suppresses failure when no baseline is committed at all, so an
        # intentional re-record against an existing, now-mismatching baseline
        # is expected to fail this comparison. That's fine: the fresh
        # screenshot is written to disk before the comparison runs, so
        # continue-on-error lets the job carry on and commit it as the new
        # baseline below.
        continue-on-error: true
        env:
          RECORD_SCREENSHOTS: "1"
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: bundle exec rspec spec/system/regression/fum_regression_spec.rb

      - name: Commit regenerated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -u rather than a *.png glob: the record step also produces
          # .base.png/.diff.png/.base.diff.png diff artifacts, which are
          # gitignored, and git refuses to add an explicitly-named ignored
          # path even alongside tracked matches. -u only restages the plain
          # .png files already tracked in git.
          git add -u doc/screenshots/regression/
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "Regenerate visual regression baselines [skip ci]"
            git push origin HEAD:${{ inputs.branch }}
          fi
