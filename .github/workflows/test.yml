name: CI Workflow
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write

    env:
      RAILS_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1/find_unclaimed_court_money_test"

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: find_unclaimed_court_money_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Chrome diagnostics
        run: |
          echo "chrome-path output: ${{ steps.setup-chrome.outputs.chrome-path }}"
          file "${{ steps.setup-chrome.outputs.chrome-path }}" || true
          ldd "${{ steps.setup-chrome.outputs.chrome-path }}" | grep "not found" || echo "no missing shared libraries"
          "${{ steps.setup-chrome.outputs.chrome-path }}" --version
          "${{ steps.setup-chrome.outputs.chrome-path }}" --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage --dump-dom about:blank

      - name: Install packages
        run: |
          yarn install --frozen-lockfile

      - name: Chromedriver diagnostics
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: bundle exec ruby bin/chrome_diagnostics.rb

      - name: Precompile assets
        run: bin/rails assets:precompile

      - name: Setup test database
        run: bin/rails db:prepare

      - name: Lint stylesheets
        run: yarn run lint

      - name: Lint Ruby files
        run: bundle exec rubocop

      - name: Security audit application code
        run: bundle exec brakeman -q

      - name: Check for vulnerable dependencies with Snyk
        uses: snyk/actions/ruby@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --exclude=vendor,node_modules --severity-threshold=high

      - name: Run tests
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: bundle exec rspec

      - name: Upload regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-screenshots
          path: doc/screenshots/regression/*.png
          retention-days: 7

      - name: Code coverage
        uses: joshmfrankel/simplecov-check-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          minimum_suite_coverage: 100
          minimum_file_coverage: 100

  build-and-deploy:
    needs: test
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
